version: '3'

tasks:
  default:
    cmds:
      - task: serve
      - open http://localhost:8000

  build:
    cmds:
      - "sphinx-build  $(pwd)/src/ $(pwd)/docs"
    desc: "Build the documentation into ./docs"

  serve:
    cmds: 
      - "sphinx-autobuild -b dirhtml $(pwd)/src $(pwd)/docs"
    desc: "Serve the documentation locally."